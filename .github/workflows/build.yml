name: Build

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  release:
    types: [published]

permissions:
  contents: write # needed for release upload

jobs:
  build:
    name: Build plugin with fooyin SDK (Linux)
    runs-on: ubuntu-latest
    container: ubuntu:24.04

    env:
      FOOYIN_SDK_RELEASE: nightly
      FOOYIN_PREFIX: ${{ github.workspace }}/fooyin-install

    steps:
      - name: Dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential  \
            git \
            cmake \
            ninja-build \
            pkg-config \
            ca-certificates \
            xz-utils \
            qt6-base-dev \
            libqt6svg6 \
            libqt6sql6-sqlite \
            libavcodec60 \
            libavfilter9 \
            libavformat60 \
            libavutil58 \
            libswresample4 \
            libicu74 \
            libtag1v5 \
            libarchive13t64 \
            zlib1g-dev \
            libqcoro6core0t64 \
            libqcoro6network0t64

      - name: Checkout plugin
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download fooyin SDK
        uses: robinraju/release-downloader@v1
        with:
          repository: fooyin/fooyin
          tag: ${{ env.FOOYIN_SDK_RELEASE }}
          fileName: fooyin-sdk-*-linux-x64-qt6.4.tar.xz
          out-file-path: fooyin-sdk

      - name: Extract fooyin SDK
        shell: bash
        run: |
          set -euo pipefail
          archives=(fooyin-sdk/*.tar.xz)
          if [[ ${#archives[@]} -ne 1 ]]; then
            echo "Expected one Linux Qt 6.4 SDK" >&2
            exit 1
          fi
          mkdir -p "$FOOYIN_PREFIX"
          tar -xJf "${archives[0]}" -C "$FOOYIN_PREFIX" --strip-components=1
          cat "$FOOYIN_PREFIX/sdk-manifest.json"

      - name: Configure plugin
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$FOOYIN_PREFIX" \
            -DBUILD_PLUGIN_BUNDLE=ON \
            -DLIBRARY_TYPE=SHARED

      - name: Build plugin
        run: cmake --build build

      - name: Package plugin bundle
        run: cmake --build build --target package_plugin

      - name: Check bundled runtime dependencies
        run: |
          ldd -r build/bundle/linux-x64/fyplugin_vgminput.so > build/ldd.txt
          cat build/ldd.txt
          if grep -Eq 'not found|undefined symbol:' build/ldd.txt; then
            exit 1
          fi
          for library in player emu utils; do
            if ! grep -Eq "libvgm-${library}\.so => .*/bundle/linux-x64/" build/ldd.txt; then
              echo "libvgm-${library} is not loaded from the bundle"
              exit 1
            fi
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: fooyin-plugin-libvgm-linux
          path: build/fooyin-libvgm-linux-x64.fyplugin
          if-no-files-found: error

  build-windows:
    name: Build plugin with fooyin SDK (Windows)
    runs-on: windows-latest

    env:
      FOOYIN_SDK_RELEASE: nightly
      FOOYIN_PREFIX: ${{ github.workspace }}/fooyin-install
      QT_VERSION: '6.12.0'
      VCPKG_COMMIT: 40f3c709db80acf154ac4b17a1f83c564ebd022e
      VCPKG_DISABLE_METRICS: true
      VCPKG_ROOT_DIR: C:/vcpkg
      VCPKG_INSTALLED_DIR: C:/v

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download fooyin SDK
        uses: robinraju/release-downloader@v1
        with:
          repository: fooyin/fooyin
          tag: ${{ env.FOOYIN_SDK_RELEASE }}
          fileName: fooyin-sdk-*-windows-x64-msvc-qt6.12.zip
          out-file-path: fooyin-sdk-download
          extract: true
          extract-path: fooyin-sdk

      - name: Set up fooyin SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $prefixes = @(Get-ChildItem fooyin-sdk -Directory)
          if ($prefixes.Count -ne 1) {
            throw 'Expected one SDK installation directory'
          }
          Move-Item -LiteralPath $prefixes[0].FullName -Destination $env:FOOYIN_PREFIX
          Get-Content "$env:FOOYIN_PREFIX/sdk-manifest.json"

      - name: Set up vcpkg
        shell: pwsh
        run: |
          git init $env:VCPKG_ROOT_DIR
          if (-not (git -C $env:VCPKG_ROOT_DIR remote get-url origin 2>$null)) {
            git -C $env:VCPKG_ROOT_DIR remote add origin https://github.com/microsoft/vcpkg.git
          }
          git -C $env:VCPKG_ROOT_DIR fetch --depth 1 origin $env:VCPKG_COMMIT
          git -C $env:VCPKG_ROOT_DIR checkout --detach FETCH_HEAD
          & "$env:VCPKG_ROOT_DIR/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          # Support the Windows x64 repository layout used by Qt 6.11 and later.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b
          archives: qtbase qtsvg qttools
          cache: true
          arch: win64_msvc2022_64
          install-deps: 'true'

      - name: Set up MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: amd64

      - name: Cache vcpkg
        uses: actions/cache@v6
        with:
          path: ${{ env.VCPKG_INSTALLED_DIR }}
          key: windows-vcpkg-libvgm-x64-${{ env.VCPKG_COMMIT }}

      - name: Install zlib
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT_DIR/vcpkg.exe" install zlib:x64-windows `
            "--x-install-root=$env:VCPKG_INSTALLED_DIR" --classic
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Configure plugin
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:FOOYIN_PREFIX" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT_DIR/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_INSTALLED_DIR="$env:VCPKG_INSTALLED_DIR" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DQt6_DIR="$env:QT_ROOT_DIR/lib/cmake/Qt6" `
            -DBUILD_PLUGIN_BUNDLE=ON `
            -DLIBRARY_TYPE=SHARED

      - name: Build plugin
        run: cmake --build build

      - name: Package plugin bundle
        run: cmake --build build --target package_plugin

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: fooyin-plugin-libvgm-windows
          path: build/fooyin-libvgm-windows-x64.fyplugin
          if-no-files-found: error

  bundle:
    name: Package all platforms
    runs-on: ubuntu-latest
    needs: [build, build-windows]
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v7
        with:
          name: fooyin-plugin-libvgm-linux
          path: ./artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@v7
        with:
          name: fooyin-plugin-libvgm-windows
          path: ./artifacts

      - name: Package combined plugin bundle
        run: |
          cmake -E make_directory bundle
          cd bundle
          cmake -E tar xf ../artifacts/fooyin-libvgm-linux-x64.fyplugin
          cmake -E tar xf ../artifacts/fooyin-libvgm-windows-x64.fyplugin
          cmake -E tar cf ../fooyin-libvgm.fyplugin --format=zip linux-x64 windows-x64 licenses COPYING README.md

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: fooyin-plugin-libvgm-all
          path: fooyin-libvgm.fyplugin
          if-no-files-found: error

  attach:
    name: Attach to release
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    needs: [bundle]
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v7
        with:
          name: fooyin-plugin-libvgm-linux
          path: ./artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@v7
        with:
          name: fooyin-plugin-libvgm-windows
          path: ./artifacts

      - name: Download combined artifact
        uses: actions/download-artifact@v7
        with:
          name: fooyin-plugin-libvgm-all
          path: ./artifacts

      - name: Upload Linux artifact to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.event.release.tag_name }}
          file: ./artifacts/fooyin-libvgm-linux-x64.fyplugin
          overwrite: true

      - name: Upload Windows artifact to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.event.release.tag_name }}
          file: ./artifacts/fooyin-libvgm-windows-x64.fyplugin
          overwrite: true

      - name: Upload combined artifact to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.event.release.tag_name }}
          file: ./artifacts/fooyin-libvgm.fyplugin
          overwrite: true
